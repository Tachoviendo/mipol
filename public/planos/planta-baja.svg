<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 688" role="img" aria-labelledby="tituloPlano descripcionPlano" font-family="system-ui, -apple-system, sans-serif">
  <title id="tituloPlano">Planta Baja - Liceo 1° de Salto</title>
  <desc id="descripcionPlano">Plano esquemático base de la planta baja del liceo. Cada zona tiene un identificador (pb-aula-1, pb-biblioteca, etc.) y coordenadas en el viewBox (820 x 688) para superponer los puntos de interés. Escala aproximada: 1px ≈ 0,4 m.</desc>

  <!-- Encabezado -->
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0f172a">Planta Baja - Liceo 1° de Salto</text>
  <text x="24" y="52" font-size="11" fill="#64748b">Base del mapa interactivo · 1px ≈ 0,4 m (aproximado)</text>

  <!-- Leyenda -->
  <g font-size="11" fill="#334155">
    <rect x="24" y="62" width="16" height="13" fill="#e8f1f9" stroke="#0f4c81" stroke-width="1.5" />
    <text x="46" y="73">Aulas</text>
    <rect x="112" y="62" width="16" height="13" fill="#e6f6fd" stroke="#1b7fb0" stroke-width="1.5" />
    <text x="134" y="73">Biblioteca</text>
    <rect x="216" y="62" width="16" height="13" fill="#fff1e0" stroke="#f5a623" stroke-width="1.5" />
    <text x="238" y="73">Laboratorio</text>
    <rect x="322" y="62" width="16" height="13" fill="#e8f7ee" stroke="#2f855a" stroke-width="1.5" />
    <text x="344" y="73">Dirección</text>
    <rect x="424" y="62" width="16" height="13" fill="#e6f6fd" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="446" y="73">Comedor y patio</text>
    <rect x="556" y="62" width="16" height="13" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="578" y="73">Baños · Pasillo</text>
  </g>

  <!-- Rosa de los vientos -->
  <g transform="translate(732, 88)">
    <circle r="22" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M0 14 L-7 -14 L0 -6 L7 -14 Z" fill="#0f4c81" />
    <text x="0" y="-28" text-anchor="middle" font-size="12" font-weight="600" fill="#0f4c81">N</text>
  </g>

  <!-- ================= COLUMNA IZQUIERDA ================= -->
  <g id="pb-aula-1">
    <rect x="28" y="116" width="328" height="100" fill="#e8f1f9" stroke="#0f4c81" stroke-width="2" />
    <text x="192" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#0f4c81">Aula 1</text>
  </g>
  <g id="pb-aula-2">
    <rect x="28" y="216" width="328" height="100" fill="#e8f1f9" stroke="#0f4c81" stroke-width="2" />
    <text x="192" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#0f4c81">Aula 2</text>
  </g>
  <g id="pb-aula-3">
    <rect x="28" y="316" width="328" height="100" fill="#e8f1f9" stroke="#0f4c81" stroke-width="2" />
    <text x="192" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#0f4c81">Aula 3</text>
  </g>
  <g id="pb-comedor">
    <rect x="28" y="416" width="328" height="100" fill="#cfe9f7" stroke="#0ea5e9" stroke-width="2" />
    <text x="192" y="458" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Comedor</text>
    <text x="192" y="476" text-anchor="middle" font-size="10" fill="#0ea5e9">escolar</text>
  </g>
  <g id="pb-banos">
    <rect x="28" y="516" width="328" height="100" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
    <text x="192" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Baños</text>
    <text x="192" y="574" text-anchor="middle" font-size="10" fill="#64748b">Estudiantes · Docentes</text>
  </g>

  <!-- ================= COLUMNA DERECHA ================= -->
  <g id="pb-aula-4">
    <rect x="464" y="116" width="328" height="125" fill="#e8f1f9" stroke="#0f4c81" stroke-width="2" />
    <text x="628" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#0f4c81">Aula 4</text>
  </g>
  <g id="pb-laboratorio">
    <rect x="464" y="241" width="328" height="125" fill="#fff1e0" stroke="#f5a623" stroke-width="2" />
    <text x="628" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">Laboratorio</text>
    <text x="628" y="318" text-anchor="middle" font-size="10" fill="#ea580c">Física y Química</text>
  </g>
  <g id="pb-biblioteca">
    <rect x="464" y="366" width="328" height="125" fill="#e6f6fd" stroke="#1b7fb0" stroke-width="2" />
    <text x="628" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#1b7fb0">Biblioteca</text>
    <text x="628" y="442" text-anchor="middle" font-size="10" fill="#2ca6e0">Lectura y préstamo</text>
  </g>
  <g id="pb-direccion">
    <rect x="464" y="491" width="328" height="125" fill="#e8f7ee" stroke="#2f855a" stroke-width="2" />
    <text x="628" y="548" text-anchor="middle" font-size="12" font-weight="600" fill="#2f855a">Dirección</text>
    <text x="628" y="566" text-anchor="middle" font-size="10" fill="#4d7c0f">Secretaría y Adscripción</text>
  </g>

  <!-- ================= PASILLO Y SERVICIOS ================= -->
  <g id="pb-escalera">
    <rect x="360" y="100" width="100" height="128" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
    <line x1="368" y1="108" x2="368" y2="210" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="380" y1="118" x2="380" y2="210" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="392" y1="118" x2="392" y2="210" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="404" y1="118" x2="404" y2="210" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="416" y1="118" x2="416" y2="210" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="428" y1="118" x2="428" y2="210" stroke="#94a3b8" stroke-width="1.5" />
    <text x="410" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Escaleras</text>
    <text x="410" y="148" text-anchor="middle" font-size="9" fill="#64748b">1º y 2º piso</text>
  </g>

  <g id="pb-pasillo">
    <rect x="360" y="228" width="100" height="364" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <text x="410" y="480" text-anchor="middle" font-size="11" font-weight="600" fill="#475569" transform="rotate(90 410 480)">Pasillo central</text>
  </g>

  <g id="pb-entrada">
    <rect x="360" y="592" width="100" height="32" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <line x1="360" y1="608" x2="410" y2="608" stroke="#0f4c81" stroke-width="2" />
    <line x1="460" y1="608" x2="410" y2="608" stroke="#0f4c81" stroke-width="2" />
    <text x="410" y="582" text-anchor="middle" font-size="11" font-weight="600" fill="#0f4c81">Entrada principal</text>
  </g>

  <g id="pb-patio">
    <rect x="24" y="632" width="772" height="42" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="410" y="658" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Patio central (exterior)</text>
  </g>

  <!-- Puertas desde el pasillo -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="356" y1="162" x2="360" y2="162" />
    <line x1="356" y1="266" x2="360" y2="266" />
    <line x1="356" y1="366" x2="360" y2="366" />
    <line x1="356" y1="466" x2="360" y2="466" />
    <line x1="356" y1="566" x2="360" y2="566" />
    <line x1="464" y1="178" x2="460" y2="178" />
    <line x1="464" y1="303" x2="460" y2="303" />
    <line x1="464" y1="428" x2="460" y2="428" />
    <line x1="464" y1="553" x2="460" y2="553" />
  </g>

  <!-- Muro exterior -->
  <rect x="24" y="100" width="772" height="524" rx="6" fill="none" stroke="#475569" stroke-width="4" />
</svg>